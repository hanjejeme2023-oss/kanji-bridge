<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字ブリッジ（試作版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --mist:#f5f6f8; --ink:#16181d; --sub:#7b808a; --line:#e8e9ec;
  --indigo:#2f3e9e; --indigo-soft:#eef0fb; --right:#1d7f53; --right-soft:#e8f5ee; --wrong:#b8432e; --wrong-soft:#fbeeea;
  --sans:"Noto Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.ko{font-family:"Noto Sans KR",var(--sans)}
.zh{font-family:"Noto Sans SC",var(--sans)}
.han{font-family:"Noto Serif JP",serif;font-weight:700}
.han.ko{font-family:"Noto Serif KR",serif;font-weight:500}
.han.zh{font-family:"Noto Serif SC",serif;font-weight:500}
.hidden{display:none !important}
.sub{color:var(--sub)}
.small{font-size:13px}

/* top bar */
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);z-index:5;border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px}
.logo{font-weight:600;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.logo .han{font-weight:700;margin-right:2px}
nav{display:flex;gap:2px;margin:0 auto;overflow-x:auto}
nav button{border:none;background:none;padding:7px 14px;border-radius:999px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--ink);color:#fff}
.today{font-size:13px;color:var(--sub);white-space:nowrap}
@media(max-width:760px){.today{display:none}.bar{gap:12px;padding:0 14px}}

main{max-width:760px;margin:0 auto;padding:40px 24px 80px}
@media(max-width:600px){main{padding:24px 16px 60px}}

/* controls */
.seg{display:inline-flex;background:var(--mist);border-radius:999px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,.12)}
#psel{flex-wrap:wrap}
.tabcount{font-size:11px;opacity:.75;margin-left:4px}
.tab-explain{color:var(--sub);font-size:13px;margin:-20px 0 28px}
.tone-hint{font-size:12px;color:var(--sub);text-align:center;margin-top:3px}
.examples{max-width:620px;margin:30px auto 0;display:grid;gap:14px;text-align:left}
.example{border-top:1px solid var(--line);padding-top:13px;font-size:14px}
.example mark{background:var(--indigo-soft);color:var(--indigo);padding:1px 2px;border-radius:3px}
.example .translation{color:var(--sub);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 20px;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.pill:hover{border-color:#c9ccd2}
.pill.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.dark:hover{background:#2c2f36}
.pill.right{border-color:var(--right);background:var(--right-soft);color:var(--right)}
.pill.wrong{border-color:var(--wrong);background:var(--wrong-soft);color:var(--wrong)}
.key{display:inline-block;min-width:18px;font-size:11px;line-height:16px;padding:0 4px;border-radius:4px;background:var(--mist);color:var(--sub);margin-right:8px;text-align:center;vertical-align:1px;font-family:"Noto Sans",sans-serif}
.pill.dark .key{background:rgba(255,255,255,.18);color:#fff;margin:0 0 0 8px}
.tag{display:inline-block;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);margin:4px 6px 0 0}
.tag.off{background:var(--mist);color:var(--sub)}

/* card view */
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:56px}
.progress i{display:block;height:100%;background:var(--indigo);transition:width .3s}
.stage{text-align:center}
.giant{font-size:clamp(88px,18vw,148px);line-height:1.05;letter-spacing:.04em}
.readings{font-size:20px;margin-top:18px;display:flex;gap:28px;justify-content:center}
.alt{font-size:13px;color:var(--sub);margin-top:6px}
.answer-in{max-width:360px;margin:48px auto 0;display:grid;gap:22px}
.field{text-align:left}
.field span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.field input{width:100%;border:none;border-bottom:2px solid var(--line);padding:8px 2px;font:inherit;font-size:22px;text-align:center;background:transparent}
.field input:focus{outline:none;border-bottom-color:var(--indigo)}
.reveal{margin-top:44px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}.progress i{transition:none}}
.ans{display:flex;gap:48px;justify-content:center;flex-wrap:wrap}
.ans .lang{font-size:12px;color:var(--sub)}
.ans .val{font-size:34px;font-weight:500;line-height:1.3}
.ans .you{font-size:13px;margin-top:2px}
.ok{color:var(--right)} .close{color:#9a6a0a} .ng{color:var(--wrong)}
.meta{margin-top:28px}
.rate{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.rate .pill{min-width:128px}
.rate small{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.done{text-align:center;padding:80px 0}
.done h2{font-size:28px;font-weight:600;margin:0 0 8px}

/* rules */
.rulebar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:48px}
.rulebar button{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 16px;cursor:pointer;text-align:center;min-width:92px}
.rulebar button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rulebar .r{font-size:17px}
.rulebar .p{font-size:11px;color:var(--sub)}
.rulehead{text-align:center;margin-bottom:8px}
.rulehead h2{font-size:30px;font-weight:600;margin:0}
.rulehead p{margin:6px 0 0;color:var(--sub);font-size:14px}
.qcard{text-align:center;margin:48px 0 0}
.qcard .giant{font-size:96px}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.opts .pill{font-size:22px;min-width:120px;padding:12px 22px}
.after{margin-top:24px;text-align:center}
details{margin-top:64px;border-top:1px solid var(--line);padding-top:20px}
summary{cursor:pointer;color:var(--sub);font-size:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ "}
details[open] summary::before{content:"− "}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:16px}
th{font-size:12px;color:var(--sub);font-weight:400;text-align:left;padding:6px 8px}
td{padding:10px 8px;border-top:1px solid var(--line)}

/* false friends */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:190px;cursor:pointer;background:var(--paper);text-align:left;display:flex;flex-direction:column;transition:border-color .15s}
.tile:hover{border-color:#c9ccd2}
.tile .w{font-size:40px;line-height:1.2;margin-bottom:12px}
.tile .l{font-size:14px;color:var(--sub);line-height:1.7}
.tile .l b{color:var(--ink);font-weight:500;margin-right:6px}
.tile .hint{margin-top:auto;padding-top:14px;font-size:13px;color:var(--indigo)}
.tile.open{background:var(--wrong-soft);border-color:transparent}
.tile.open .trap{font-size:15px;color:var(--wrong);margin-top:auto;padding-top:12px}
.tile.open .trap b{font-weight:600;margin-right:6px}

/* reading */
.passage{font-size:26px;line-height:1.5;text-align:center;padding:24px 0 8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px}
.tok{display:inline-flex;flex-direction:column;align-items:center}
.tok .s{padding:2px 6px;border-radius:8px}
.tok.sino .s{cursor:pointer;box-shadow:inset 0 -2px 0 var(--indigo-soft)}
.tok.sino .s:hover{background:var(--indigo-soft)}
.tok.sel .s,.tok.sel .s:hover{background:var(--indigo);color:#fff;box-shadow:none}
.tok .w{white-space:nowrap}.tok .pt{margin-left:1px}
.tok .a{font-size:13px;color:var(--sub);line-height:1.4;min-height:18px}
.tok.func .s{color:var(--sub)}
.trans{text-align:center;color:var(--sub);font-size:14px;margin-top:12px}
.sheet{margin-top:48px;background:var(--mist);border-radius:20px;padding:28px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
@media(max-width:600px){.sheet .grid{grid-template-columns:repeat(2,1fr)}}
.sheet .cell span{display:block;font-size:12px;color:var(--sub)}
.sheet .cell div{font-size:18px}
.empty{text-align:center;color:var(--sub);font-size:14px;margin-top:40px}

/* glyph */
.grow{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;align-items:center;padding:18px 0;border-top:1px solid var(--line);text-align:center}
.grow:first-of-type{border-top:none}
.grow .g{font-size:52px;line-height:1.1}
.grow .lbl{font-size:12px;color:var(--sub)}
.grow .zhcol .g{color:var(--indigo)}
.grow .rd{font-size:14px;color:var(--sub);line-height:1.8}
.ghead{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;text-align:center;font-size:12px;color:var(--sub);padding-bottom:6px}

.spk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;vertical-align:middle;margin-left:8px;color:var(--sub);padding:0;flex:none}
.spk:hover{color:var(--indigo);border-color:var(--indigo)}
.spk.on{color:#fff;background:var(--indigo);border-color:var(--indigo)}
.spk svg{width:15px;height:15px}
.toggle{border:none;background:none;font-size:13px;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.toggle i{width:28px;height:16px;border-radius:8px;background:var(--line);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on i{background:var(--indigo)}
.toggle.on i::after{left:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;max-width:min(560px,90vw);z-index:20;line-height:1.6}
footer{max-width:760px;margin:0 auto;padding:0 24px 40px;color:var(--sub);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{border:none;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="han">漢</span> ブリッジ</div>
    <nav id="nav">
      <button data-v="cards" class="on">カード <span class="tabcount" id="count-cards"></span></button>
      <button data-v="rules">音のルール <span class="tabcount" id="count-rules"></span></button>
      <button data-v="ff">偽の友達 <span class="tabcount" id="count-ff"></span></button>
      <button data-v="read">読解 <span class="tabcount" id="count-read"></span></button>
      <button data-v="glyph">字体 <span class="tabcount" id="count-glyph"></span></button>
    </nav>
    <button class="toggle" id="mute" type="button"><i></i>ミュート</button>
    <div class="today" id="topstat"></div>
  </div>
</header>

<main>
<section id="v-cards">
  <p class="tab-explain">2字以上の単語を、日本語と韓国語を手がかりに中国語・ベトナム語で答える</p>
  <div class="toolbar">
    <div class="seg" id="target">
      <button data-t="vi" class="on">ベトナム語</button>
      <button data-t="zh">中国語</button>
      <button data-t="both">両方</button>
    </div>
    <div style="display:flex;gap:16px;align-items:center"><button class="toggle" id="autoplay" type="button"><i></i>答えを自動で再生</button><span class="sub small" id="queueinfo"></span></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div id="cardbox"></div>
</section>

<section id="v-rules" class="hidden">
  <p class="tab-explain">韓国語のパッチムからベトナム語の語末を推測するルール</p>
  <div class="rulebar" id="rulebar"></div>
  <div id="ruledetail"></div>
</section>

<section id="v-ff" class="hidden">
  <p class="tab-explain">同じ漢字でも言語によって意味が違う、間違えやすい単語</p>
  <div class="toolbar">
    <div class="seg" id="fffilter">
      <button data-f="all" class="on">すべて</button>
      <button data-f="zh">中国語</button>
      <button data-f="vi">ベトナム語</button>
    </div>
    <div class="sub small">タップすると本当の意味</div>
  </div>
  <div class="tiles" id="fflist"></div>
</section>

<section id="v-read" class="hidden">
  <p class="tab-explain">短い中国語・ベトナム語の文を読み、わからない語をタップして確認する</p>
  <div class="toolbar">
    <div class="seg" id="psel"></div>
    <label class="sub small"><input type="checkbox" id="showann" checked> 読みを表示</label>
  </div>
  <div class="passage" id="passage"></div>
  <div class="trans" id="ptrans"></div>
  <div id="tokdetail"></div>
</section>

<section id="v-glyph" class="hidden">
  <p class="tab-explain">1字の漢字の形（日本・繁体・簡体）と読み、使われ方</p>
  <div class="toolbar">
    <div class="seg" id="gmode">
      <button data-g="list" class="on">一覧</button>
      <button data-g="quiz">クイズ</button>
    </div>
    <div class="seg" id="gfilter">
      <button data-p="all" class="on">すべて</button>
      <button data-p="diff">3つとも違う</button>
      <button data-p="jz">日本＝中国</button>
      <button data-p="jk">日本＝韓国</button>
    </div>
  </div>
  <div id="glyphbox"></div>
</section>
</main>

<footer>
  <span>試作版。学習記録はこのブラウザにだけ保存されます。</span>
  <button id="reset">記録をリセット</button>
</footer>

<script src="data.js"></script>
<script>
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- data adapters (Stage 5) ---------- */
const KB=window.KB_DATA;
if(!KB)throw new Error('KB_DATA failed to load');
const splitVals=s=>s?s.split(';'):[];
const WC_BY_WORD=new Map();
KB.word_chars.forEach(x=>{if(!WC_BY_WORD.has(x.word_id))WC_BY_WORD.set(x.word_id,[]);WC_BY_WORD.get(x.word_id).push(x)});
const adaptWord=x=>{
  const w={id:x.word_id,h:x.trad,j:x.jp||x.trad,z:x.simp||x.trad,p:x.pinyin||'',
    jr:x.ja?(x.ja_use==='rare'?`（${x.ja}）`:x.ja):'',
    k:x.ko?(x.ko_use==='rare'?`（${x.ko}）`:x.ko):'',v:x.vi||'',
    pt:x.pt||'',syl:x.syl_aligned?(WC_BY_WORD.get(x.word_id)||[]):null};
  if(x.vi){const va=splitVals(x.vi_alt);if(va.length)w.va=va}
  if(x.note_ja)w.note=x.note_ja;
  return w;
};
const WORD_BY_ID=new Map(KB.words.map(x=>[x.word_id,adaptWord(x)]));
const WORDS=KB.words.filter(x=>x.card_eligible&&[...x.trad].length>1).sort((a,b)=>(a.level??99)-(b.level??99)||
  (a.freq_vi??Number.MAX_SAFE_INTEGER)-(b.freq_vi??Number.MAX_SAFE_INTEGER)||a.word_id.localeCompare(b.word_id))
  .map(x=>WORD_BY_ID.get(x.word_id));

const EXAMPLES=new Map(KB.examples.map(x=>[`${x[0]}:${x[1]}:${x[2]}`,
  {wordId:x[0],lang:x[1],use:x[2],sentence:x[3],pinyin:x[4],translation:x[5],start:x[6],len:x[7]}]));

const RULES=KB.rules;
const NONE_RULE={jong:0,vi:[''],label:'パッチムなし → 子音で終わらない'};

const LANG_LABEL={ja:'日',ko:'韓',zh:'中',vi:'越'}, LANG_ORDER=['ja','ko','zh','vi'];
const FF_ROWS=new Map();
KB.ff_meanings.forEach(x=>{if(!FF_ROWS.has(x.word_id))FF_ROWS.set(x.word_id,[]);FF_ROWS.get(x.word_id).push(x)});
const FF=KB.words.filter(x=>x.false_friend).map(x=>{
  const w=WORD_BY_ID.get(x.word_id), rows=(FF_ROWS.get(x.word_id)||[]).slice()
    .sort((a,b)=>LANG_ORDER.indexOf(a.lang)-LANG_ORDER.indexOf(b.lang));
  const display=r=>r.reading_display||(r.lang==='zh'&&w.z!==w.j&&w.z!==w.h?`${w.z} ${w.p}`:r.reading||'');
  const line=r=>[LANG_LABEL[r.lang],display(r),r.meaning_ja||''];
  const traps=x.false_friend.split(';');
  return {id:x.word_id,w:x.jp||x.trad,safe:rows.filter(r=>!r.is_trap).map(line),
    trap:rows.filter(r=>r.is_trap).map(line),t:traps.includes('zh')?'zh':traps.includes('vi')?'vi':traps[0]};
});

const PASSAGE_ROWS=KB.passages.slice().sort((a,b)=>(a.lang==='vi'?0:1)-(b.lang==='vi'?0:1)||
  a.level-b.level||a.passage_id.localeCompare(b.passage_id));
const PASSAGE_N={vi:0,zh:0};
const PASSAGES=PASSAGE_ROWS.map(p=>({id:p.passage_id,lang:p.lang,
  name:`${p.lang==='vi'?'越':'中'} ${++PASSAGE_N[p.lang]}`,tr:p.translation_ja,
  toks:p.tokens.map(t=>t.word_id?{t:t.t,w:WORD_BY_ID.get(t.word_id)}:
    t.gloss_ja?{t:t.t,g:t.gloss_ja}:{t:t.t,x:1})}));

const CHAR_BY_ID=new Map(KB.chars.map(x=>[x.char_id,x]));
const GLYPHS=KB.glyphs.map(row=>{const x=CHAR_BY_ID.get(row[0]);return [x.jp,x.key_char,x.simp,
  splitVals(x.pinyin_all).join(' / '),splitVals(x.ja_on_all).join(' / '),
  splitVals(x.ko_base_all).join(' / '),splitVals(x.vi_all).join(' / '),row[0],row[1],row[2],row[3],row[4]]})
  .filter(x=>!(x[0]===x[1]&&x[1]===x[2]));


const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const norm=s=>s.normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PY_TONE_MARKS=/[\u0304\u0301\u030c\u0300]/g;
const VI_TONE_MARKS=/[\u0301\u0300\u0309\u0303\u0323]/g;
const VI_SHAPED=/[ăâêôơưđáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵ]/i;
function telexSyllable(raw){
  let s=raw.toLocaleLowerCase('vi');
  if(VI_SHAPED.test(s))return s;
  s=s.replace(/dd/g,'đ').replace(/uwow/g,'ươ').replace(/uow/g,'ươ')
    .replace(/aa/g,'â').replace(/ee/g,'ê').replace(/oo/g,'ô')
    .replace(/aw/g,'ă').replace(/ow/g,'ơ').replace(/uw/g,'ư');
  while(s.includes('w')){const i=s.indexOf('w'),before=s.slice(0,i);let changed=before;
    const uo=before.lastIndexOf('uo');
    if(uo>=0)changed=before.slice(0,uo)+'ươ'+before.slice(uo+2);
    else{let pos=-1;for(let j=0;j<before.length;j++)if(/[aou]/.test(before[j]))pos=j;
      if(pos>=0){const map={a:'ă',o:'ơ',u:'ư'};changed=before.slice(0,pos)+map[before[pos]]+before.slice(pos+1)}
      else changed=before+'ư'}
    s=changed+s.slice(i+1);
  }
  const first=[...s].findIndex(ch=>/[aeiouyăâêôơư]/.test(ch));
  if(first>=0)s=[...s].filter((ch,i)=>!(i>first&&/[sfrxjz]/.test(ch))).join('');
  return s;
}
const pyKey=s=>String(s).toLocaleLowerCase().replace(/u:|v/g,'ü').normalize('NFD')
  .replace(PY_TONE_MARKS,'').replace(/[ '’-]/g,'');
const viKey=(s,typed=false)=>{
  let value=String(s).toLocaleLowerCase('vi').normalize('NFC');
  if(typed)value=value.replace(/\p{L}+/gu,telexSyllable);
  return value.normalize('NFD').replace(VI_TONE_MARKS,'').normalize('NFC').replace(/\s+/g,'');
};
function judge(input,lang,accepted,viAlt=[],several=false){
  if(!input||!input.trim())return null;
  const answers=(Array.isArray(accepted)?accepted:[accepted]).filter(Boolean);
  const alternates=lang==='vi'?(Array.isArray(viAlt)?viAlt:[viAlt]).filter(Boolean):[];
  const parts=several?input.split(/[,/，／、]/).map(x=>x.trim()).filter(Boolean):[input];
  if(!parts.length)return null;
  const expected=lang==='zh'?answers.map(pyKey):answers.concat(alternates).map(x=>viKey(x,false));
  return parts.every(part=>expected.includes(lang==='zh'?pyKey(part):viKey(part,true)))?'ok':'ng';
}
const PY_TONE_NAME={1:'1声',2:'2声',3:'3声',4:'4声',5:'軽声'};
const VI_TONE_NAME={'\u0301':'sắc','\u0300':'huyền','\u0309':'hỏi','\u0303':'ngã','\u0323':'nặng'};
function markedTone(syllable,lang){
  const marks=[...String(syllable).normalize('NFD')];
  if(lang==='zh'){const order='\u0304\u0301\u030c\u0300',mark=marks.find(ch=>order.includes(ch));
    return mark?PY_TONE_NAME[order.indexOf(mark)+1]:'軽声'}
  const mark=marks.find(ch=>VI_TONE_NAME[ch]);return mark?VI_TONE_NAME[mark]:'ngang';
}
function toneHint(lang,readings,tones=''){
  const values=(Array.isArray(readings)?readings:[readings]).filter(Boolean);
  return values.map(reading=>{
    if(lang==='zh'&&tones&&values.length===1)return [...tones].map(x=>PY_TONE_NAME[x]).filter(Boolean).join('・');
    const syllables=String(reading).split(/\s+|['’-]+/).filter(Boolean);
    return syllables.map(x=>markedTone(x,lang)).join('・');
  }).join(' / ');
}
const viFinal=s=>{const m=strip(s).match(/(ng|nh|ch|c|p|t|n|m)$/);return m?m[1]:''};
function ruleTags(w){
  if(!w.syl)return'';
  return w.syl.map(pair=>{
    const ch=(pair.ko_syllable||'').replace(/[（）()]/g,''),vi=pair.vi_syllable||'';
    const code=ch.charCodeAt(0)-0xAC00;if(code<0||code>11171)return'';
    const jong=code%28,r=jong===0?NONE_RULE:RULES.find(x=>x.jong===jong);if(!r)return'';
    const ok=r.vi.includes(viFinal(vi));
    return `<span class="tag ${ok?'':'off'}"><span class="ko">${ch}</span> → ${esc(vi)}　${ok?esc(r.label):'例外'}</span>`;
  }).join('');
}

function renderRead(){
  $('#psel').innerHTML=PASSAGES.map(p=>`<button data-p="${p.id}" class="${p.id===pid?'on':''}">${p.name}</button>`).join('');
  $$('#psel button').forEach(b=>b.onclick=()=>{pid=b.dataset.p;selTok=null;renderRead()});
  const p=PASSAGES.find(x=>x.id===pid), ann=$('#showann').checked;
  $('#passage').className='passage '+(p.lang==='zh'?'zh':'');
  $('#passage').innerHTML=p.toks.map((t,i)=>{
    if(t.x)return '';
    const nx=p.toks[i+1], tail=nx&&nx.x?`<span class="pt">${esc(nx.t)}</span>`:'';
    if(t.g)return `<span class="tok func"><span class="w"><span class="s">${esc(t.t)}</span>${tail}</span><span class="a">${ann?esc(t.g):''}</span></span>`;
    const a=p.lang==='vi'?t.w.h:`${t.w.jr}　${t.w.k}`;
    return `<span class="tok sino ${selTok===i?'sel':''}" data-i="${i}"><span class="w"><span class="s" tabindex="0" role="button">${esc(t.t)}</span>${tail}</span><span class="a ${p.lang==='vi'?'han zh':''}">${ann?esc(a):''}</span></span>`;
  }).join('');
  const sent=p.lang==='vi'?p.toks.map(t=>t.t).join(' ').replace(/ ([.,])/g,'$1'):p.toks.map(t=>t.t).join('');
  $('#ptrans').innerHTML=`${esc(p.tr)}${spk(sent,p.lang)}`;
  $$('.tok.sino .s').forEach(el=>{const pick=()=>{selTok=+el.closest('.tok').dataset.i;renderRead()};el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}});
  const d=$('#tokdetail');
  if(selTok===null){d.innerHTML='<div class="empty">下線の単語をタップすると、4つの言語の対応が出る</div>';return}
  const w=p.toks[selTok].w, inDeck=deck().some(x=>x.id===w.id);
  d.innerHTML=`<div class="sheet">
    <div class="top"><div class="han" style="font-size:44px;line-height:1.1">${esc(w.h)}</div>
      <button class="pill ${inDeck?'':'dark'}" id="addcard" ${inDeck?'disabled':''}>${inDeck?'カードに追加済み':'カードに追加'}</button></div>
    <div class="grid">
      <div class="cell"><span>日本語</span><div>${esc(w.jr)}</div></div>
      <div class="cell"><span>韓国語</span><div class="ko">${esc(w.k)}</div></div>
      <div class="cell"><span>中国語</span><div><span class="zh">${esc(w.z)}</span> ${esc(w.p)}${w.p?spk(w.z,'zh'):''}</div></div>
      <div class="cell"><span>ベトナム語</span><div>${esc(w.v)}${w.v?spk(w.v,'vi'):''}</div></div>
    </div>
    ${w.note?`<p class="sub small" style="margin:16px 0 0">${esc(w.note)}</p>`:''}
    <div style="margin-top:14px">${ruleTags(w)}</div></div>`;
  if(!inDeck)$('#addcard').onclick=()=>{custom.push(w.id);S.set('kb_custom',custom);updateCounts();renderRead();topStat()};
}

/* 5. glyph */
let gmode='list', gfil='all', gq=null, gscore=S.get('kb_glyph',{ok:0,n:0});
const pat=g=>g[0]===g[2]&&g[0]!==g[1]?'jz':g[0]===g[1]&&g[0]!==g[2]?'jk':g[0]!==g[1]&&g[1]!==g[2]&&g[0]!==g[2]?'diff':'same';
$$('#gmode button').forEach(b=>b.onclick=()=>{gmode=b.dataset.g;$$('#gmode button').forEach(x=>x.classList.toggle('on',x===b));$('#gfilter').classList.toggle('hidden',gmode!=='list');renderGlyph()});
$$('#gfilter button').forEach(b=>b.onclick=()=>{gfil=b.dataset.p;$$('#gfilter button').forEach(x=>x.classList.toggle('on',x===b));renderGlyph();updateCounts()});
function renderGlyph(){
  if(gmode==='list'){
    const list=filteredGlyphs();
    $('#glyphbox').innerHTML=list.length?`<div class="ghead"><span>日本</span><span>韓国・繁体</span><span>中国・簡体</span><span>読み</span></div>`+list.map(g=>`<div class="grow">
      <div><div class="g han">${g[0]}</div><div class="lbl">${g[4]}</div></div>
      <div><div class="g han ko">${g[1]}</div><div class="lbl ko">${g[5]}</div></div>
      <div class="zhcol"><div class="g han zh">${g[2]}</div><div class="lbl">${g[3]}${spk(g[2],'zh')}</div></div>
      <div class="rd">${esc(g[6])}${spk(g[6].replace(/ \/ /g,', '),'vi')}</div></div>`).join(''):'<div class="empty">該当する字はない</div>';
    return;
  }
  if(!gq){const pool=GLYPHS.filter(g=>g[0]!==g[2]);const g=pool[Math.floor(Math.random()*pool.length)];
    const others=shuffle(GLYPHS.filter(x=>x[2]!==g[2]).map(x=>x[2])).slice(0,3);gq={g,opts:shuffle([g[2],...others]),ans:null}}
  const g=gq.g;
  $('#glyphbox').innerHTML=`<div class="qcard" style="margin-top:8px">
    <div class="sub small">中国の簡体字はどれ？　${gscore.ok} / ${gscore.n} 正解</div>
    <div class="giant han" style="margin-top:16px">${g[0]}</div>
    <div class="readings"><span class="sub">韓国 <span class="han ko">${g[1]}</span></span><span class="sub">${g[4]}</span></div>
    <div class="opts">${gq.opts.map((o,i)=>`<button class="pill ${gq.ans?(o===g[2]?'right':(o===gq.ans?'wrong':'')):''}" data-o="${o}" style="font-size:30px"><span class="key">${i+1}</span><span class="han zh">${o}</span></button>`).join('')}</div>
    <div class="after">${gq.ans?`<div class="small ${gq.ans===g[2]?'ok':'ng'}" style="margin-bottom:14px">${gq.ans===g[2]?'正解':'正解は '+g[2]}　${g[3]}${spk(g[2],'zh')}</div><button class="pill dark" id="gnext">次へ<span class="key">Enter</span></button>`:''}</div>
  </div>`;
  $$('#glyphbox .opts button').forEach(b=>b.onclick=()=>pickGlyph(b.dataset.o));
  const n=$('#gnext');if(n){n.onclick=()=>{gq=null;renderGlyph()};n.focus({preventScroll:true})}
}
function pickGlyph(o){if(gq.ans)return;gq.ans=o;if(autoplay){stopSpeech();speak(gq.g[2],'zh',null,true)}gscore.n++;if(o===gq.g[2])gscore.ok++;S.set('kb_glyph',gscore);renderGlyph()}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const n=['1','2','3','4'].indexOf(e.key);
  if(view==='cards'&&flipped&&n>=0){e.preventDefault();rate(n);return}
  if(view==='cards'&&flipped&&cur){const k=e.key.toLowerCase();
    if(k==='v'&&target!=='zh'){e.preventDefault();stopSpeech();speak(cur.v,'vi');return}
    if(k==='c'&&target!=='vi'){e.preventDefault();stopSpeech();speak(cur.z,'zh');return}}
  if(view==='cards'&&!flipped&&cur&&(e.key==='Enter'||e.key===' ')){e.preventDefault();doFlip();return}
  if(view==='rules'&&quiz){
    if(!quiz.ans&&n>=0&&n<quiz.opts.length){e.preventDefault();pickRule(quiz.opts[n]);return}
    if(quiz.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();quiz=null;renderRules();return}
  }
  if(view==='glyph'&&gmode==='quiz'&&gq){
    if(!gq.ans&&n>=0&&n<gq.opts.length){e.preventDefault();pickGlyph(gq.opts[n]);return}
    if(gq.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gq=null;renderGlyph();return}
  }
});

/* reset */
let armed=false;
$('#reset').onclick=()=>{
  if(!armed){armed=true;$('#reset').textContent='もう一度押すとリセット';setTimeout(()=>{armed=false;$('#reset').textContent='記録をリセット'},3000);return}
  srs={};custom=[];rprog={};gscore={ok:0,n:0};doneToday=0;newToday={date:localDay(),ids:[]};
  S.set('kb_srs',{});S.set('kb_custom',[]);S.set('kb_newtoday',newToday);S.set('kb_rules',{});S.set('kb_glyph',gscore);
  cur=null;flipped=false;armed=false;$('#reset').textContent='記録をリセット';render();
};

render();
</script>
